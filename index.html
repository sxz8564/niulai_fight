<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Niulai Fight 牛来大战</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%90%AE%3C/text%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #10141a;
               font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
  #view { display: block; width: 100vw; height: 100vh; touch-action: none; }

  /* The HUD sits over the picture and never takes pointer events, so a tap
     meant for a control button is not eaten by the score. */
  #hud { position: fixed; inset: 0; pointer-events: none; padding: 14px;
         display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; align-items: center; gap: 14px; }
  .bar { width: min(38vw, 280px); height: 18px; border: 2px solid #f4e7cf;
         background: #2a1d16; padding: 2px; }
  .bar > i { display: block; height: 100%; width: 100%; background: #7ec850;
             transition: width 120ms linear; }
  .bar > i.low { background: #d9483b; }
  .label { color: #f4e7cf; font-size: 15px; letter-spacing: .08em;
           white-space: nowrap; text-shadow: 0 2px 0 #000, 0 0 4px rgba(0,0,0,.6); }
  .spacer { flex: 1; }

  #banner { position: fixed; inset: 0; display: grid; place-items: center;
            align-content: center; gap: 18px;
            color: #ffd76a; font-size: clamp(26px, 5.6vw, 60px); letter-spacing: .1em;
            /* Gold on a cream sky is nearly the same value. The hard drop makes
               the shape; the soft one underneath separates it from the sky. */
            text-shadow: 0 4px 0 #000, 0 0 14px rgba(0, 0, 0, .8);
            pointer-events: none; text-align: center; }
  #banner .again { color: #f4e7cf; font-size: 17px; letter-spacing: .18em;
                   text-shadow: 0 2px 0 #000, 0 0 6px rgba(0, 0, 0, .85); }
  /* A win has something to look at underneath it, so the words move out of the
     middle of the picture and let the hero have it. */
  #banner.won { align-content: start; padding-top: 7vh; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center;
             color: #f4e7cf; background: #10141a; font-size: 17px; letter-spacing: .1em; }
  /* An id selector outranks the browser's own [hidden] rule, so setting
     .hidden on these would otherwise change nothing and leave the loading
     screen sitting on top of a running game. */
  #loading[hidden], #banner[hidden], #select[hidden], #bossrow[hidden] { display: none; }
  #paused[hidden] { display: none; }

  /* The three controls a player wants without leaving the fight. The HUD takes
     no pointer events so a tap meant for the pad is never eaten by the score;
     these are the one part of it that has to. */
  .tools { display: flex; gap: 6px; pointer-events: auto; }
  .tools button { width: 36px; height: 32px; padding: 0;
                  border: 2px solid #4b5563; background: #10141acc; color: #cdd6e0;
                  font: inherit; font-size: 14px; line-height: 1; border-radius: 7px;
                  cursor: pointer; }
  .tools button:hover, .tools button:focus-visible { border-color: #ffd76a; color: #ffd76a;
                                                     outline: none; }
  .tools button.off { color: #5d6773; border-color: #2b323c; }

  #paused { position: fixed; inset: 0; display: grid; place-items: center; align-content: center;
            gap: 14px; background: #10141a99; color: #ffd76a;
            font-size: clamp(26px, 5.6vw, 60px); letter-spacing: .1em; text-align: center;
            text-shadow: 0 4px 0 #000, 0 0 14px rgba(0, 0, 0, .8); pointer-events: none; }
  #paused .again { color: #f4e7cf; font-size: 17px; letter-spacing: .18em;
                   text-shadow: 0 2px 0 #000, 0 0 6px rgba(0, 0, 0, .85); }
  #ragewrap[hidden], #ragelabel[hidden], #hint[hidden] { display: none; }

  /* The rage meter. Narrower than the health bar and a different colour, so a
     glance never confuses "how am I doing" with "can I do the thing yet". */
  .bar.rage { width: min(20vw, 150px); height: 12px; border-color: #d1a0ff; }
  .bar.rage > i { background: #8b5cf6; }
  #ragewrap.ready .bar.rage > i { background: #ffd76a; }
  #ragewrap.ready #ragelabel { color: #ffd76a; }
  #ragewrap.super .bar.rage { border-color: #ff8a3d; }
  #ragewrap.super .bar.rage > i { background: #ff8a3d; }
  #ragewrap.super #ragelabel { color: #ff8a3d; }
  @keyframes charged { 50% { opacity: .45; } }
  #ragewrap.ready { animation: charged .5s steps(1) infinite; }
  #ragewrap { display: flex; align-items: center; gap: 8px; }

  /* The boss bar. A different colour from the player's so a glance tells you
     whose health you are looking at, and it flashes through the wind-up
     because that second is the only warning the charge gives. */
  .bar.boss { width: min(46vw, 340px); border-color: #ffd76a; }
  .bar.boss > i { background: #d9843b; }
  #bossrow.winding .bar.boss > i { background: #ffd76a; }
  #bossrow.winding #bossname { color: #ffd76a; }
  @keyframes tell { 50% { opacity: .35; } }
  #bossrow.winding { animation: tell .18s steps(1) infinite; }

  #select { position: fixed; inset: 0; z-index: 5; display: grid; place-content: center;
            justify-items: center; gap: 6px; background: #10141a; text-align: center; }
  #select h1 { color: #f4e7cf; font-size: clamp(24px, 4vw, 40px); margin: 0 0 2px;
               letter-spacing: .08em; }
  #select h1 span { color: #ffd76a; }
  #select p { color: #8b95a3; font-size: 15px; letter-spacing: .1em; margin: 0 0 14px; }
  #select .foot { margin-top: 18px; font-size: 13px; }
  /* The music switch. Small, out of the way of the roster, and readable from
     across the room because it is the one control on this screen that is not a
     character. */
  #music { margin-top: 14px; background: none; border: 2px solid #39424f;
           border-radius: 999px; color: #8b95a3; font: inherit; font-size: 13px;
           letter-spacing: .16em; padding: 7px 16px; cursor: pointer; }
  #music:hover, #music:focus-visible { border-color: #ffd76a; color: #ffd76a; outline: none; }
  #music[aria-pressed="false"] { color: #5d6773; border-color: #2b323c; }
  #roster { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
  /* Each card carries its own little renderer, so the roster shows the actual
     models rather than art that could drift from them. */
  #roster button { width: 234px; background: #1b2028; border: 2px solid #39424f;
                   border-radius: 12px; padding: 12px; color: #f4e7cf; font: inherit;
                   cursor: pointer; display: grid; justify-items: center; gap: 6px; }
  #roster button:hover, #roster button:focus-visible { border-color: #ffd76a; outline: none; }
  #roster canvas { width: 168px; height: 168px; display: block; }
  #roster .name { font-size: 18px; letter-spacing: .06em; }
  #roster .zh { color: #ffd76a; font-size: 15px; }
  #roster .blurb { color: #8b95a3; font-size: 13px; line-height: 1.5; min-height: 2.6em; }
  #roster .key { color: #5d6773; font-size: 12px; letter-spacing: .14em; }

  #pad { position: fixed; inset: auto 0 0 0; padding: 18px;
         display: flex; justify-content: space-between; pointer-events: none; }
  #pad div { display: grid; grid-template-columns: repeat(3, 56px); gap: 6px; pointer-events: auto; }
  #pad button { height: 56px; border: 2px solid #f4e7cf; background: #2a1d1699;
                color: #f4e7cf; font: inherit; font-size: 18px; border-radius: 8px;
                touch-action: none; user-select: none; }
  #pad button:active { background: #f4e7cf; color: #2a1d16; }
  #pad button[hidden] { display: none; }
  #padpower { border-color: #d1a0ff; color: #d1a0ff; }
  /* The hint sits over the sky, which is nearly white, and over trees, which
     are nearly black. Grey with no shadow disappeared into both. Light text
     with a hard dark shadow is the only thing that reads on either. */
  .hint { color: #d3dae3; font-size: 14px; letter-spacing: .06em;
          text-shadow: 0 2px 0 #000, 0 0 4px rgba(0,0,0,.7); }
  /* A keyboard makes the on-screen pad redundant, and it covers the ground. */
  @media (hover: hover) and (pointer: fine) { #pad { display: none; } }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="hud">
  <div class="row">
    <span class="label" id="who">NIULAI 牛来</span>
    <span class="bar"><i id="health"></i></span>
    <span class="label" id="lives">🐮🐮🐮</span>
    <span id="ragewrap" hidden>
      <span class="label" id="ragelabel">RAGE</span>
      <span class="bar rage"><i id="rage"></i></span>
    </span>
    <span class="spacer"></span>
    <span class="label">STAGE <b id="stage">1/5</b></span>
    <span class="label">SCORE <b id="score">000000</b></span>
    <span class="tools">
      <button id="t-music" type="button" aria-label="music on" aria-pressed="true">♪</button>
      <button id="t-pause" type="button" aria-label="pause" aria-pressed="false">❚❚</button>
      <button id="t-restart" type="button" aria-label="restart">↻</button>
    </span>
  </div>
  <div class="row" id="bossrow" hidden>
    <span class="label" id="bossname">THE CART 木车</span>
    <span class="bar boss"><i id="bosshealth"></i></span>
  </div>
  <div class="row"><span class="hint" id="hint">← → move · ↑ ↓ step up and down · J punch · K kick · L hold to block · P pause</span></div>
</div>

<div id="banner" hidden></div>
<div id="paused" hidden>PAUSED<div class="again">P or ❚❚ to resume</div></div>

<div id="select">
  <h1>Niulai Fight <span>牛来大战</span></h1>
  <p>Choose a fighter</p>
  <div id="roster"></div>
  <p class="foot">1 / 2 or click · then ← → to move, J punch, K kick, L block</p>
  <button id="music" type="button" aria-pressed="true">♪ MUSIC ON</button>
</div>
<div id="loading">LOADING…</div>

<div id="pad">
  <div>
    <button data-action="left" aria-label="left">◀</button>
    <button data-action="up" aria-label="up">▲</button>
    <button data-action="right" aria-label="right">▶</button>
    <span></span>
    <button data-action="down" aria-label="down">▼</button>
    <span></span>
  </div>
  <div style="grid-template-columns: repeat(3, 56px)">
    <button data-action="punch" aria-label="punch">P</button>
    <button data-action="kick" aria-label="kick">K</button>
    <button data-action="block" aria-label="block">B</button>
    <span></span>
    <span></span>
    <button data-action="power" aria-label="mama" id="padpower" hidden>M</button>
  </div>
</div>

<script src="src/boot-check.js"></script>
<script type="module" src="dist/bundle.js"></script>
</body>
</html>
